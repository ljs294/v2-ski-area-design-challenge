<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://tile.openstreetmap.org; connect-src https://tile.openstreetmap.org; worker-src blob:; child-src blob:">
  <link rel="stylesheet" href="maplibre-gl.css">
  <link rel="stylesheet" href="selector.css">
  <title>Mountain bounds selector</title>
</head>
<body>
  <div id="map" aria-label="Terrain bounds map"></div>
  <form id="selection">
    <label>Name <input id="name" maxlength="80" value="Crystal Mountain"></label>
    <label>Width <input id="size" type="range" min="2" max="10" step="0.5" value="2"><output id="sizeOut">2 km</output></label>
    <label>Profile <select id="profile"><option value="standard">Standard</option><option value="high">High</option></select></label>
    <button type="submit">Prepare selected mountain</button>
    <div id="status" role="status">Click the map to center the selection.</div>
  </form>
  <script src="maplibre-gl.js"></script>
  <script src="selector.js"></script>
</body>
</html>
