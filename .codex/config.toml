# Project-local routing: Sol High is the main/default agent for P1 and later
# routine work. Actual session routing must still be verified.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-sol"
default_subagent_reasoning_effort = "high"
